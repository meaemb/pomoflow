name: pomoflow
description: Pomodoro Timer App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  uuid: ^4.5.1
  intl: ^0.19.0
  url_launcher: ^6.2.1
  go_router: ^13.0.1
  shared_preferences: ^2.2.2
  showcaseview: ^3.0.0
  audioplayers: ^6.0.0
  flutter_riverpod: ^2.4.0
  json_annotation: ^4.8.1
  http: ^1.1.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.5
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_core_web: ^2.20.0
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.7.1
  test: ^1.24.3
  mockito: ^5.4.2
  build_runner: ^2.4.0
  golden_toolkit: ^0.15.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  image_path: "assets/icons/icon.png"
  windows:
    generate: true
    icon_size: 48
    image_path: "assets/icons/icon.png"
  web:
    generate: true
    image_path: "assets/icons/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/tips/
    - assets/categories/
    - assets/avatars/
    - assets/sounds/
    - assets/backgrounds/
    - assets/data/
    - assets/animations/
